<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
:root { --red: #ff1a0f; --bg: #0a0a0a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: #f2f2f2; overflow: hidden;
  font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
.bg { position: fixed; inset: 0; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
.o1 { width: 520px; height: 520px; background: #b00800; left: -120px; top: -140px; animation: drift1 16s ease-in-out infinite alternate; }
.o2 { width: 460px; height: 460px; background: #ff1a0f; right: -160px; bottom: -180px; opacity: .28; animation: drift2 20s ease-in-out infinite alternate; }
.grid { position: absolute; inset: 0; opacity: .5;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 46px 46px; -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 70%); mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 70%); }
@keyframes drift1 { to { transform: translate(180px, 120px) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-200px, -90px) scale(1.2); } }

#stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 24px; text-align: center; opacity: 0; transition: opacity .4s; }
#stage.intro, #stage.home { opacity: 1; }

.logo { width: 92px; height: 92px; border-radius: 26px; box-shadow: 0 0 0 1px rgba(255,26,15,.25), 0 20px 60px rgba(255,26,15,.35);
  animation: pop 1s cubic-bezier(.2,.9,.3,1.25) both, float 5s ease-in-out 1s infinite; transition: width .6s, height .6s, border-radius .6s; }
.home .logo { width: 72px; height: 72px; border-radius: 20px; }
@keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-12deg); } }
@keyframes float { 50% { transform: translateY(-7px); } }

h1 { margin: 0; font-size: 38px; font-weight: 750; letter-spacing: -.02em; animation: rise .8s .25s cubic-bezier(.2,.8,.2,1) both; transition: opacity .3s; }
h1 em { font-style: normal; color: var(--red); }
#sub { margin: -6px 0 6px; color: #9a9a9a; animation: rise .8s .4s cubic-bezier(.2,.8,.2,1) both; transition: opacity .3s, max-height .4s, margin .4s; max-height: 40px; }
.home #sub { opacity: 0; max-height: 0; margin: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(22px); } }

.engines { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
.card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 150px; padding: 24px 12px 20px;
  color: inherit; font: inherit; cursor: pointer; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 22px;
  backdrop-filter: blur(8px); transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, background .25s, box-shadow .25s, opacity .4s; }
.intro .card { animation: rise .7s calc(.7s + var(--i) * .1s) cubic-bezier(.2,.8,.2,1) both; }
.intro .card:hover { transform: translateY(-8px); border-color: rgba(255,26,15,.6); background: rgba(255,26,15,.07); box-shadow: 0 18px 40px rgba(255,26,15,.18); }
.intro .card:active { transform: translateY(-3px) scale(.97); }
.ico { overflow: hidden; width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-weight: 800; font-size: 32px; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.nm { font-weight: 600; }
.engines.leaving .card:not(.sel) { opacity: 0; transform: translateY(16px) scale(.9); }
.engines.leaving .card.sel { opacity: 0; transform: scale(1.18); transition-delay: .12s; }

.home .engines { gap: 8px; }
.home .card { flex-direction: row; width: auto; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 999px; animation: rise .5s calc(.35s + var(--i) * .06s) cubic-bezier(.2,.8,.2,1) both; }
.home .ico { width: 24px; height: 24px; border-radius: 8px; font-size: 14px; box-shadow: none; }
.home .nm { font-size: 13px; color: #aaa; transition: color .2s; }
.home .card:hover { background: rgba(255,255,255,.09); }
.home .card.sel { border-color: var(--red); background: rgba(255,26,15,.12); box-shadow: 0 0 22px rgba(255,26,15,.25); }
.home .card.sel .nm { color: #fff; }

#search { position: relative; width: min(640px, 90vw); max-height: 0; opacity: 0; overflow: visible; pointer-events: none; transform: translateY(20px);
  transition: opacity .5s .25s, transform .6s .25s cubic-bezier(.2,.8,.2,1), max-height .4s; order: 3; }
.home #search { max-height: 70px; opacity: 1; transform: none; pointer-events: auto; }
#q { width: 100%; height: 58px; padding: 0 24px 0 56px; border-radius: 29px; color: #fff; font: inherit; font-size: 17px; outline: none;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); transition: border-color .25s, box-shadow .25s, background .25s; }
#q::placeholder { color: #808080; }
#q:focus { border-color: var(--red); background: rgba(255,255,255,.09); box-shadow: 0 0 0 4px rgba(255,26,15,.18), 0 12px 40px rgba(255,26,15,.18); }
#search svg { z-index: 1; pointer-events: none; position: absolute; left: 21px; top: 18px; width: 22px; height: 22px; stroke: #888; fill: none; stroke-width: 2; stroke-linecap: round; transition: stroke .25s; }
#search:focus-within svg { stroke: var(--red); }
.pins { order: 4; display: flex; gap: 12px; justify-content: center; max-height: 0; opacity: 0; overflow: hidden; pointer-events: none; transform: translateY(16px);
  transition: opacity .5s .4s, transform .6s .4s cubic-bezier(.2,.8,.2,1), max-height .4s; }
.home .pins { max-height: 110px; opacity: 1; transform: none; pointer-events: auto; overflow: visible; }
.pin { display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 10px; color: inherit; font: inherit; text-align: left; cursor: pointer;
  background: linear-gradient(160deg, rgba(255,26,15,.14), rgba(255,255,255,.04)); border: 1px solid rgba(255,26,15,.35); border-radius: 18px;
  backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(255,26,15,.12); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s; }
.pin:hover { transform: translateY(-4px); border-color: var(--red); box-shadow: 0 16px 40px rgba(255,26,15,.28); }
.pin:active { transform: scale(.97); }
.pin img { width: 42px; height: 42px; border-radius: 12px; }
.pin b { display: block; font-size: 15px; } .pin small { display: block; margin-top: 1px; color: #a0a0a0; font-size: 12px; }
.pin .pt { margin-left: 6px; font-size: 10px; letter-spacing: .1em; color: #ff6a60; text-transform: uppercase; }
.hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: #5a5a5a; font-size: 12px; opacity: 0; transition: opacity .6s .8s; }
.home ~ .hint, body.is-home .hint { opacity: 1; }
</style>
</head>
<body>
<div class="bg"><span class="orb o1"></span><span class="orb o2"></span><div class="grid"></div></div>
<main id="stage">
  <img class="logo" src="logo.png" alt="Nano">
  <h1 id="title">Welcome to <em>Nano</em></h1>
  <p id="sub">Choose your search engine to get started</p>
  <div class="engines" id="engines"></div>
  <form id="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" autocomplete="off" spellcheck="false">
  </form>
  <div class="pins"><button type="button" class="pin" id="pinChat"><img src="logo.png" alt=""><span><b>Nano AI</b><small>Chat with Nano's own AI</small></span><span class="pt">Pinned</span></button></div>
</main>
<div class="hint">Ctrl+T new tab &nbsp;·&nbsp; Ctrl+L address bar &nbsp;·&nbsp; <span style="color:#ff4a3f;letter-spacing:.12em">BY VANTA</span></div>
<script>
const ENGINES = [
  { id: 'nano',       name: 'Nano Seek',  bg: '#0a0a0a', glyph: '<img src="logo.png" alt="" style="width:100%;height:100%;border-radius:inherit">' },
  { id: 'google',     name: 'Google',     bg: '#ffffff', glyph: '<span style="background:conic-gradient(from -45deg,#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);-webkit-background-clip:text;color:transparent">G</span>' },
  { id: 'duckduckgo', name: 'DuckDuckGo', bg: 'linear-gradient(135deg,#ff7a45,#de5833)', glyph: 'D' },
  { id: 'bing',       name: 'Bing',       bg: 'linear-gradient(135deg,#17b3a3,#00756a)', glyph: 'b' },
  { id: 'brave',      name: 'Brave',      bg: 'linear-gradient(135deg,#ff6a3d,#e4310f)', glyph: 'B' }
];
const $ = id => document.getElementById(id);
const stage = $('stage'), box = $('engines'), q = $('q'), api = window.nano || { getEngine: async () => null, setEngine() {}, search() {}, open() {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
let current = null;

ENGINES.forEach((e, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'card'; b.dataset.id = e.id; b.style.setProperty('--i', i);
  b.innerHTML = '<span class="ico" style="background:' + e.bg + '">' + e.glyph + '</span><span class="nm">' + e.name + '</span>';
  b.onclick = () => pick(e.id);
  box.appendChild(b);
});

function mark() {
  [...box.children].forEach(b => b.classList.toggle('sel', b.dataset.id === current));
  const e = ENGINES.find(x => x.id === current);
  q.placeholder = 'Search with ' + e.name + ' or enter an address';
}
function setMode(m) {
  stage.className = m;
  document.body.classList.toggle('is-home', m === 'home');
  $('title').innerHTML = m === 'home' ? '<em>Nano</em>' : 'Welcome to <em>Nano</em>';
  if (m === 'home') q.focus();
}
async function pick(id) {
  const first = stage.classList.contains('intro');
  current = id; api.setEngine(id); mark();
  if (first) { box.classList.add('leaving'); await sleep(520); box.classList.remove('leaving'); setMode('home'); }
}
$('pinChat').onclick = () => api.open('chat');
$('search').addEventListener('submit', e => { e.preventDefault(); const v = q.value.trim(); if (v) api.search(v); });

(async () => {
  current = await api.getEngine();
  if (current) { mark(); setMode('home'); } else setMode('intro');
})();
</script>
</body>
</html>
